name: 重建壁纸清单

# 管理模式删图 / 手动在 wallpapers/ 增减文件后，重建 data/wallpapers.json。
on:
  repository_dispatch:
    types: [rebuild-manifest]
  workflow_dispatch:
  push:
    paths:
      - 'wallpapers/**'
      - 'thumbs/**'

permissions:
  contents: write

concurrency:
  group: rebuild-manifest
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # git log 需要完整历史来取文件日期

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 data/wallpapers.json
        run: node scripts/build-manifest.mjs

      - name: 提交清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "manifest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/wallpapers.json
          if git diff --cached --quiet; then
            echo "清单没有变化，跳过提交"
            exit 0
          fi
          git commit -m "重建壁纸清单 $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "第 $i 次推送遇到并发，重试…"
            sleep 3
          done

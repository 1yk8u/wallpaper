name: Build wallpaper manifest

on:
  push:
    paths:
      - 'wallpapers/**'
      - 'data/links.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build manifest
        run: node scripts/build-manifest.mjs

      - name: Commit manifest
        run: |
          git config user.name "wallpaper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/wallpapers.json
          if git diff --cached --quiet; then
            echo "manifest 无变化，跳过提交"
          else
            git commit -m "自动更新壁纸清单 [skip ci]"
            git push
          fi

name: 自研解析引擎（自家代抓）

# 前端「解析」页派单走 repository_dispatch；也可在 Actions 页面手动填链接跑一次。
# 注意：relayDispatch 发的是 client_payload.url（单条），旧版只读 .urls → 派单永远空跑。
on:
  repository_dispatch:
    types: [parse-request, parse-batch]
  workflow_dispatch:
    inputs:
      urls:
        description: 要解析的链接（多条用换行或逗号分隔）
        required: true
        type: string
      profile:
        description: 按快手主页批量模式解析
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: parse-relay
  cancel-in-progress: false

jobs:
  # 轻量通道：网易云 / 汽水 / X（推特）。
  # 三者都只需 node 原生 fetch，不装浏览器，十几秒就能把字节抓进仓库。
  # ★ 开关语义：只有下面这些域名才会触发本 job；抖音/快手/B站/小红书/其它绝不进。
  fast:
    if: >-
      ${{
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', '163.com') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'qishui') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'music.douyin.com') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'twitter.com') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'x.com/') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'twimg.com') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 't.co/') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'fxtwitter.com') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'vxtwitter.com') ||
        contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'fixupx.com')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取官方字节到自家仓库（音乐 / X）
        env:
          PARSE_URLS: ${{ github.event.client_payload.urls || github.event.client_payload.url || inputs.urls }}
        run: node parser/relay.mjs

      - name: 提交音频 / X 媒体与解析结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "parse-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "没有新结果，跳过提交"
            exit 0
          fi
          git commit -m "轻量代抓结果 $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "第 $i 次推送遇到并发，重试…"
            sleep 3
          done

  # 图片 / 视频通道：官方 Playwright 容器里跑真实浏览器解析。
  # ★ 音乐与 X 已被上面的 fast job 接走，这里显式排除，绝不启动浏览器。
  parse:
    if: >-
      ${{
        !(
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', '163.com') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'qishui') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'music.douyin.com') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'twitter.com') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'x.com/') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'twimg.com') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 't.co/') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'fxtwitter.com') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'vxtwitter.com') ||
          contains(github.event.client_payload.urls || github.event.client_payload.url || inputs.urls || '', 'fixupx.com')
        )
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖与浏览器
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: 跑自研解析引擎
        env:
          PARSE_URLS: ${{ github.event.client_payload.urls || github.event.client_payload.url || inputs.urls }}
          PARSE_PROFILE: ${{ (github.event.client_payload.profile || inputs.profile) && '1' || '0' }}
          PARSE_COOKIES: ${{ secrets.PARSE_COOKIES }}
          PARSE_PROXY: ${{ secrets.PARSE_PROXY }}
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node parser/relay.mjs

      - name: 上传解析结果产物
        uses: actions/upload-artifact@v4
        with:
          name: parsed-data
          path: data/
          if-no-files-found: ignore

  # 容器内 git 路径不可靠，图片/视频结果拆到普通 runner 上提交
  commit:
    needs: parse
    if: ${{ needs.parse.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 下载解析结果
        uses: actions/download-artifact@v4
        with:
          name: parsed-data
          path: data

      - name: 提交解析结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "parse-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "没有新结果，跳过提交"
            exit 0
          fi
          git commit -m "自研引擎解析结果 $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "第 $i 次推送遇到并发，重试…"
            sleep 3
          done

name: 自研解析引擎（自家代抓）

# 前端「解析」页派单走 repository_dispatch；也可在 Actions 页面手动填链接跑一次。
on:
  repository_dispatch:
    types: [parse-request, parse-batch]
  workflow_dispatch:
    inputs:
      urls:
        description: 要解析的链接（多条用换行或逗号分隔）
        required: true
        type: string
      profile:
        description: 按快手主页批量模式解析
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: parse-relay
  cancel-in-progress: false

jobs:
  # 第一阶段：在官方 Playwright 容器里跑真实浏览器解析（Chromium+运行库预装，不碰 apt）
  parse:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖与浏览器
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: 跑自研解析引擎
        env:
          PARSE_URLS: ${{ github.event.client_payload.urls || inputs.urls }}
          PARSE_PROFILE: ${{ (github.event.client_payload.profile || inputs.profile) && '1' || '0' }}
          PARSE_COOKIES: ${{ secrets.PARSE_COOKIES }}
          PARSE_PROXY: ${{ secrets.PARSE_PROXY }}
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node parser/relay.mjs

      - name: 上传解析结果产物
        uses: actions/upload-artifact@v4
        with:
          name: parsed-data
          path: data/
          if-no-files-found: ignore

  # 第二阶段：在普通 runner 上把结果提交回仓库（容器内 git 路径不可靠，故拆出来）
  commit:
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 下载解析结果
        uses: actions/download-artifact@v4
        with:
          name: parsed-data
          path: data

      - name: 提交解析结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "parse-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parsed data/parse-cache.json
          if git diff --cached --quiet; then
            echo "没有新结果，跳过提交"
            exit 0
          fi
          git commit -m "自研引擎解析结果 $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "第 $i 次推送遇到并发，重试…"
            sleep 3
          done

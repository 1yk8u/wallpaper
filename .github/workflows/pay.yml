# 支付订单自动到账 worker（GitHub Pages 站点的"服务端"）
# 触发：前端下单时 repository_dispatch 立即触发 / 每 5 分钟兜底 / 手动
# 密钥：仓库 Settings → Secrets and variables → Actions
#   XORPAY_AID       XorPay 后台「商户信息」里的 appid（形如一串字母数字）
#   XORPAY_SECRET    XorPay 后台的 app secret
#   XORPAY_NOTIFY_URL（可选，Variables 里填）回调地址；不填也能靠低频查询识别到账
name: 支付订单自动到账

on:
  repository_dispatch:
    types: [pay_new]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 只取 worker 脚本（不拉整个仓库，启动更快）
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/pay-worker.mjs
          sparse-checkout-cone-mode: false

      - name: 处理订单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XORPAY_AID: ${{ secrets.XORPAY_AID }}
          XORPAY_SECRET: ${{ secrets.XORPAY_SECRET }}
          XORPAY_NOTIFY_URL: ${{ vars.XORPAY_NOTIFY_URL }}
        run: node scripts/pay-worker.mjs
